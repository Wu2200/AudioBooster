name: Build and Package IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Generate App Icon
        run: |
          python3 -m venv /tmp/icon_env
          /tmp/icon_env/bin/pip install --quiet pillow
          /tmp/icon_env/bin/python Scripts/generate_icon.py
          ls -lh AudioBooster/Assets.xcassets/AppIcon.appiconset/

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Application (.app)
        run: |
          xcodebuild clean build \
            -project AudioBooster.xcodeproj \
            -scheme AudioBooster \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "AudioBooster.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -qr AudioBooster.ipa Payload
          ls -lh AudioBooster.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioBooster-ipa
          path: AudioBooster.ipa
          retention-days: 14

      - name: Create Release and Upload IPA
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: AudioBooster v1.1.${{ github.run_number }}
          body: |
            ## AudioBooster v1.1 发布说明
            - **全新视觉设计**：生成并配置了定制的高清 App 图标与扬声器增益标识
            - **进度条全面重构**：
              - 增加了网络音频**预载/已缓冲进度条**（区分当前播放进度与已预载进度）
              - 支持直接**单击**进度条快速定位跳转，及拖拽滑动调节
            - **外部唤醒性能优化**：
              - 优化了通过 URL Scheme (`audioboost://`) 唤醒起播逻辑为**异步后台加载**，界面彻底告别卡死与等待，秒级响应
            - **界面精简与净化**：
              - 移除了底部预制音频试听模块
              - 移除了顶部容易崩坏或抖动的波形动画，换为精致稳定的状态指示器
              - 移除了音量放大提示横幅，保持界面纯净干练
          files: AudioBooster.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
