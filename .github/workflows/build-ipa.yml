name: Build and Package IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Generate App Icon
        run: |
          python3 -m venv /tmp/icon_env
          /tmp/icon_env/bin/pip install --quiet pillow
          /tmp/icon_env/bin/python Scripts/generate_icon.py
          ls -lh AudioBooster/Assets.xcassets/AppIcon.appiconset/

      - name: Commit Converted App Icon
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add AudioBooster/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist converted icon-1024.png from user image [skip ci]" || true
            git push origin main || true
          fi

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Application (.app)
        run: |
          xcodebuild clean build \
            -project AudioBooster.xcodeproj \
            -scheme AudioBooster \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "AudioBooster.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -qr AudioBooster.ipa Payload
          ls -lh AudioBooster.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioBooster-ipa
          path: AudioBooster.ipa
          retention-days: 14

      - name: Create Release and Upload IPA
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: AudioBooster v1.1.${{ github.run_number }}
          body: |
            ## AudioBooster v1.1 发布说明
            - **应用图标替换升级**：已使用你上传的精美渐变音乐双音符图标（白底微波浪高光立体质感）替换纠正为官方 1024x1024 App 图标
            - **界面精简与视觉升级**：
              - 移除了“正在播放”后面的“突破增强模式”多余文字
              - 移除了音量放大模块中的小火箭 emoji，换为简洁纯文本标签
              - 预载进度条调浅颜色，层级清晰柔和
            - **播放体验优化**：
              - 彻底修复播放到末尾卡死、重播进度条不归零的问题
              - 优化外部跳转全异步加载，界面操作丝滑不掉帧
          files: AudioBooster.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
