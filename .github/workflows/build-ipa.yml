name: Build and Package IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Generate App Icon
        run: |
          swift Scripts/generate_icon.swift
          ls -lh AudioBooster/Assets.xcassets/AppIcon.appiconset/

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Application (.app)
        run: |
          xcodebuild clean build \
            -project AudioBooster.xcodeproj \
            -scheme AudioBooster \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "AudioBooster.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -qr AudioBooster.ipa Payload
          ls -lh AudioBooster.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioBooster-ipa
          path: AudioBooster.ipa
          retention-days: 14

      - name: Create Release and Upload IPA
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AudioBooster v1.0.${{ github.run_number }}
          body: |
            ## AudioBooster 自动打包发布 (IPA)
            - 自动编译构建于 GitHub Actions (Run: #${{ github.run_number }})
            - 附带全新设计的高清 App 图标与优化播放器架构
            - 支持突破 iOS 系统音量限制 2x / 3x / 4x (+12dB)
            - 外部 URL Scheme 跳转即刻秒播，UI 全程丝滑响应
            - 适配 TrollStore (巨魔)、AltStore、Sideloadly、牛蛙助手自签安装
          files: AudioBooster.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
