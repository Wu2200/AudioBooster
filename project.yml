name: AudioBooster
options:
  bundleIdPrefix: com.wu
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  AudioBooster:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: AudioBooster
    settings:
      base:
        PRODUCT_NAME: AudioBooster
        PRODUCT_BUNDLE_IDENTIFIER: com.wu.audiobooster
        INFOPLIST_FILE: AudioBooster/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
